name: verify
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: register + write config
        run: node mkconf.mjs
      - name: install wireguard
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools
      - name: bring up
        run: sudo wg-quick up /tmp/wg0.conf && sleep 3 && sudo wg show
      - name: trace
        run: curl -s --max-time 20 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp|loc)='
      - name: down
        run: sudo wg-quick down /tmp/wg0.conf
